<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新規登録 | Group 6</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-body">
    <div class="auth-card">
        <h1>アカウント登録</h1>
        {% if error %}
        <p class="auth-error">{{ error }}</p>
        {% endif %}
        <form method="POST">
            <label for="username">ユーザー名</label>
            <input type="text" id="username" name="username" required>

            <label for="display_name">表示名</label>
            <input type="text" id="display_name" name="display_name" placeholder="未入力の場合はユーザー名" />

            <label for="password">パスワード</label>
            <input type="password" id="password" name="password" required>

            <label for="confirm_password">パスワード（確認）</label>
            <input type="password" id="confirm_password" name="confirm_password" required>

            <button type="submit" class="btn_04">登録してログイン</button>
        </form>
        <p class="auth-switch">
            すでにアカウントをお持ちの方は
            <a href="{{ url_for('login') }}">こちらからログイン</a>
        </p>
    </div>
</body>

</html>
